[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "pubmed-mdkg"
version = "0.6.0"
requires-python = ">=3.10"
dependencies = ["lxml>=5", "requests>=2.32", "rdflib>=7", "pyshacl>=0.30", "jsonschema>=4.23", "pyoxigraph>=0.5.12,<0.6"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
pmkg = "pubmed_kg.cli:entrypoint"
[tool.pytest.ini_options]
pythonpath = ["src"]

filterwarnings = [
  "ignore:Dataset.default_context is deprecated.*:DeprecationWarning:rdflib.graph",
  "ignore:Dataset.identifier is deprecated.*:DeprecationWarning:rdflib.graph",
]
